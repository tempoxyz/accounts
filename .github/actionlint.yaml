# actionlint does not know the `queue` key of `concurrency`, which keeps every pending release.
paths:
  .github/workflows/main.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'

# The shards of the end-to-end suite and the Uphill job run on Depot runners, whose labels actionlint
# does not know.
self-hosted-runner:
  labels:
    - depot-ubuntu-latest-4
    - depot-ubuntu-latest-8
