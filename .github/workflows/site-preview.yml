# Uploads a version of the site's Worker with the preview alias `pr-<number>`, after the Site run of a
# pull request from a branch of this repository succeeds. The build job of that run builds the pull
# request's Worker bundle and the files of the site without secrets, and uploads them. This workflow
# runs only main's code: main's Wrangler version and `wrangler.json` upload those files as data, with
# a short-lived Cloudflare STS token, so the pull request's code never runs where the token is. The
# token holds Workers Scripts Write on the whole production account, so it can replace each of its
# Workers. The broker's previews bind no secret and no KV namespace, which the demos' routes read, so
# a preview uploads a version with Wrangler.
name: Site preview
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] Only main's code runs, on branches of this repository.
    types: [completed]
    workflows: [Site]

# Only a successful Site run joins the group of its pull request. Each other run, whose job skips,
# gets a group of its own, so it cancels no preview.
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.pull_requests[0].number || github.run_id }}

jobs:
  # A pull request from a fork or from Dependabot gets no Cloudflare token, so it only builds.
  preview:
    name: Preview
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login != 'dependabot[bot]' &&
      github.event.workflow_run.pull_requests[0].number != null
    permissions:
      # Downloads the files of the pull request's Site run.
      actions: read
      # Checks out main's `wrangler.json` and catalog.
      contents: read
      # The secure-runner action and Cloudflare STS authenticate with an OIDC token.
      id-token: write
      # Writes the pull request's comment.
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      # Only main's `wrangler.json` and catalog, with no `package.json`, so the Wrangler action installs
      # Wrangler alone in `site/`.
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /pnpm-workspace.yaml
            /site/wrangler.json
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The Wrangler action installs the Wrangler version of main's catalog, so the catalog stays its
      # one source.
      - name: Read Wrangler version
        id: wrangler
        run: |
          version="$(sed -n -E 's/^  wrangler: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' pnpm-workspace.yaml)"
          if [ -z "$version" ]; then
            echo "::error::The catalog of pnpm-workspace.yaml names no Wrangler version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The pull request's run writes the artifact, so it may hold any file. It stays outside the
      # workspace, where it replaces no file of main.
      - name: Download site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          name: site
          path: ${{ runner.temp }}/site
          run-id: ${{ github.event.workflow_run.id }}

      # The Wrangler action installs Wrangler with npm, without the lockfile, and the runner blocks
      # each version of the last few days. The cutoff resolves each dependency as of a week ago, so
      # the catalog's Wrangler version must be older than that.
      - name: Set install cutoff
        id: cutoff
        run: echo "before=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Cloudflare STS mints the token under the `preview-upload` policy of this repository, which
      # admits only this workflow on main. The token serves only this runner's IP address, and STS
      # revokes it when the job ends.
      - name: Fetch a Cloudflare token
        id: cloudflare
        uses: tempoxyz/gh-actions/actions/cloudflare-sts@1a535d662a51f211d750307541069cb849535414 # 2026-11-19T07-33-38Z-1a535d66
        with:
          account: prd
          policy: preview-upload
          # The job's timeout, so the token outlives the upload however slow the install is.
          ttl: 10m

      # `--no-bundle` uploads the pull request's bundle unchanged, and Wrangler runs none of its code.
      # `--assets` replaces only the directory of the assets of main's `wrangler.json`. A version
      # upload changes nothing that the Worker serves. The version inherits the Worker's secrets, and
      # binds its KV namespace, so the pull request's code runs at its preview URL with both.
      - name: Upload preview
        id: upload
        uses: tempoxyz/gh-actions/vendor/cloudflare/wrangler-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        env:
          NPM_CONFIG_BEFORE: ${{ steps.cutoff.outputs.before }}
        with:
          accountId: ${{ steps.cloudflare.outputs.account-id }}
          apiToken: ${{ steps.cloudflare.outputs.token }}
          command: versions upload --config wrangler.json --no-bundle --assets ${{ runner.temp }}/site/public --preview-alias pr-${{ github.event.workflow_run.pull_requests[0].number }} ${{ runner.temp }}/site/worker/Worker.js
          workingDirectory: site
          wranglerVersion: ${{ steps.wrangler.outputs.version }}

      # The URL is the preview alias, or the URL of the version if Wrangler prints no alias.
      - name: Resolve URL
        id: url
        env:
          NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          OUTPUT: ${{ steps.upload.outputs.command-output }}
          VERSION_URL: ${{ steps.upload.outputs.deployment-url }}
        run: |
          url="$(grep --only-matching --extended-regexp "https://pr-$NUMBER-[^ ]+\.workers\.dev" <<< "$OUTPUT" | head -n 1 || true)"
          url="${url:-$VERSION_URL}"
          if [ -z "$url" ]; then
            echo "::error::Wrangler printed no URL of the uploaded version."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # A new alias takes some seconds to resolve. Cloudflare Access admits this runner, which is off
      # the tailnet, to the alias only with the service token of tempoxyz/cloudflare
      # `stacks/apps/accounts`. Only the alias receives the token, never a version URL.
      - name: Check deployment
        env:
          NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          SITE_PREVIEW_ACCESS_CLIENT_ID: ${{ secrets.SITE_PREVIEW_ACCESS_CLIENT_ID }}
          SITE_PREVIEW_ACCESS_CLIENT_SECRET: ${{ secrets.SITE_PREVIEW_ACCESS_CLIENT_SECRET }}
          URL: ${{ steps.url.outputs.url }}
        run: |
          access=()
          if [ "$URL" = "https://pr-$NUMBER-accounts-site.porto.workers.dev" ]; then
            access=(-H "CF-Access-Client-Id: $SITE_PREVIEW_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $SITE_PREVIEW_ACCESS_CLIENT_SECRET")
          fi
          curl "${access[@]}" --fail --output /dev/null --retry 10 --retry-all-errors --retry-delay 6 --show-error --silent "$URL/"
          printf 'The site runs at [%s](%s).\n' "$URL" "$URL" >> "$GITHUB_STEP_SUMMARY"

      # One comment per pull request, which each run updates.
      - name: Write comment
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ job.status }}
          URL: ${{ steps.url.outputs.url }}
        run: |
          body="$RUNNER_TEMP/comment.md"
          {
            echo '<!-- accounts-site -->'
            echo '## Site preview'
            echo
            if [ "$STATUS" = success ]; then
              echo "[$URL]($URL) runs the site at \`${HEAD_SHA:0:7}\`."
            else
              echo "The preview of \`${HEAD_SHA:0:7}\` failed. [The run]($RUN_URL) holds the error."
            fi
          } > "$body"
          id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- accounts-site -->"))) | .id' | head -n 1)"
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$body" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" -F "body=@$body" > /dev/null
          fi

permissions: {}
