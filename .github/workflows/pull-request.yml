# Verifies each pull request, and publishes its prereleases once the package checks pass.
name: Pull Request
on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

jobs:
  verify:
    name: Verify
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml

  release:
    name: Release
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    secrets: inherit
    uses: ./.github/workflows/release.yml

permissions: {}
