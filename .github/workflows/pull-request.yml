# Verifies each pull request. Only a push to main publishes to npm.
name: Pull Request
on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

jobs:
  verify:
    name: Verify
    # A called workflow's jobs get only what the caller grants. The end-to-end job pulls private
    # images, and the proof job writes the pull request's comment.
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
    uses: ./.github/workflows/verify.yml # zizmor: ignore[self-repository]

permissions: {}
