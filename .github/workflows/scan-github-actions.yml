name: Scan GitHub Actions

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/**"
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    name: Scan GitHub Actions
    if: ${{ github.event_name != 'schedule' || github.repository == 'tempoxyz/accounts' }}
    uses: tempoxyz/gh-actions/.github/workflows/scan-github-actions.yml@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
    permissions:
      actions: read
      contents: read
      id-token: write
