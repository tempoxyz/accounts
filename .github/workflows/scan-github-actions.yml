name: Scan GitHub Actions

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/**"
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    name: Scan GitHub Actions
    if: ${{ github.event_name != 'schedule' || github.repository == 'tempoxyz/accounts' }}
    uses: tempoxyz/gh-actions/.github/workflows/scan-github-actions.yml@5ae61ca34df8d8f1ae4de8da1a498444864d8563 # 2026-10-01T06-46-26Z-5ae61ca3
    permissions:
      actions: read
      contents: read
      id-token: write
