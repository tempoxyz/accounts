name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Keyed by event too, so a manual run never cancels the push run that Main waits on
# before publishing and deploying the same commit.
concurrency:
  group: verify-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@763efe11a9d8333bcbf0bb2f5ab80f21961c48fd # 2026-11-02T08-44-18Z-763efe11

      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies # zizmor: ignore[self-repository] actionlint does not support $/ references yet.

      - name: Restore turbo cache
        id: turbo-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo/cache
          key: turbo-checks-${{ github.sha }}
          restore-keys: turbo-checks-

      - name: Select affected packages
        # Main publishes and deploys only commits whose push run checked every package.
        if: github.event_name != 'push'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "${BASE//0/}" ] && git merge-base --is-ancestor "$BASE" HEAD 2> /dev/null; then
            echo "TURBO_SCM_BASE=$BASE" >> "$GITHUB_ENV"
            echo "AFFECTED=true" >> "$GITHUB_ENV"
          fi

      - name: Audit dependencies
        run: pnpm audit

      - name: Check code
        run: pnpm check

      - name: Check types
        run: pnpm exec tsc -b --noEmit

      - name: Check workspaces
        run: pnpm turbo run check:types check:markdown --filter='!accounts' ${AFFECTED:+--affected}

      - name: Prune turbo cache
        run: find .turbo/cache -type f -mtime +3 -delete

      - name: Save turbo cache
        if: github.ref == 'refs/heads/main' && steps.turbo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    env:
      TESTCONTAINERS_RYUK_DISABLED: true

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@763efe11a9d8333bcbf0bb2f5ab80f21961c48fd # 2026-11-02T08-44-18Z-763efe11

      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies # zizmor: ignore[self-repository] actionlint does not support $/ references yet.

      - name: Restore turbo cache
        id: turbo-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo/cache
          key: turbo-test-${{ github.sha }}
          restore-keys: turbo-test-

      - name: Select affected packages
        # Main publishes and deploys only commits whose push run checked every package.
        if: github.event_name != 'push'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "${BASE//0/}" ] && git merge-base --is-ancestor "$BASE" HEAD 2> /dev/null; then
            echo "TURBO_SCM_BASE=$BASE" >> "$GITHUB_ENV"
            echo "AFFECTED=true" >> "$GITHUB_ENV"
          fi

      - name: Resolve Tempo image digest
        id: tempo-digest
        run: |
          digest=$(docker manifest inspect ghcr.io/tempoxyz/tempo:latest -v 2>/dev/null | jq -r '.[0].Descriptor.digest // .Descriptor.digest' 2>/dev/null || docker buildx imagetools inspect ghcr.io/tempoxyz/tempo:latest --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Restore Tempo Docker image
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: docker-cache
        with:
          path: /tmp/tempo-image.tar
          key: tempo-image-${{ steps.tempo-digest.outputs.digest }}

      - name: Load cached Tempo image
        if: "steps.docker-cache.outputs.cache-hit == 'true'"
        run: docker load -i /tmp/tempo-image.tar

      - name: Pull and cache Tempo image
        if: "steps.docker-cache.outputs.cache-hit != 'true'"
        run: |
          docker pull ghcr.io/tempoxyz/tempo:latest
          docker save ghcr.io/tempoxyz/tempo:latest -o /tmp/tempo-image.tar

      - name: Run tests
        run: pnpm turbo run test ${AFFECTED:+--affected} -- --bail=1
        env:
          CI: true
          TEMPO_IMAGE: ${{ steps.tempo-digest.outputs.digest }}
          VITE_NODE_TAG: latest
          VITE_RPC_CREDENTIALS: ${{ secrets.VITE_RPC_CREDENTIALS }}

      - name: Prune turbo cache
        run: find .turbo/cache -type f -mtime +3 -delete

      - name: Save turbo cache
        if: github.ref == 'refs/heads/main' && steps.turbo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}

      - name: Save Tempo Docker image
        if: github.ref == 'refs/heads/main' && steps.docker-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /tmp/tempo-image.tar
          key: ${{ steps.docker-cache.outputs.cache-primary-key }}

  ci-gate:
    name: CI Gate
    if: always()
    needs: [checks, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@763efe11a9d8333bcbf0bb2f5ab80f21961c48fd # 2026-11-02T08-44-18Z-763efe11

      - name: Check results
        env:
          ANY_FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$ANY_FAILED" = true ]; then
            echo "::error::One or more required jobs failed or were cancelled."
            exit 1
          fi
