name: Verify
on:
  workflow_call:
    secrets:
      VITE_RPC_CREDENTIALS:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@5ae61ca34df8d8f1ae4de8da1a498444864d8563 # 2026-10-01T06-46-26Z-5ae61ca3

      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Audit dependencies
        run: pnpm audit

      - name: Check code
        run: pnpm -w check

      - name: Check build
        run: pnpm -w build

      - name: Check types
        run: pnpm check:types

  test-localnet:
    name: 'Test Runtime (env: localnet)'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      TESTCONTAINERS_RYUK_DISABLED: true
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@5ae61ca34df8d8f1ae4de8da1a498444864d8563 # 2026-10-01T06-46-26Z-5ae61ca3

      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          playwright: 'true'

      - name: Setup Docker
        uses: tempoxyz/gh-actions/vendor/docker/setup-docker-action@5ae61ca34df8d8f1ae4de8da1a498444864d8563 # 2026-10-01T06-46-26Z-5ae61ca3

      - name: Resolve Tempo image digest
        id: tempo-digest
        run: |
          digest=$(docker manifest inspect ghcr.io/tempoxyz/tempo:latest -v 2>/dev/null | jq -r '.[0].Descriptor.digest // .Descriptor.digest' 2>/dev/null || docker buildx imagetools inspect ghcr.io/tempoxyz/tempo:latest --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Cache Tempo Docker image
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: docker-cache
        with:
          path: /tmp/tempo-image.tar
          key: tempo-image-${{ steps.tempo-digest.outputs.digest }}

      - name: Load cached Tempo image
        if: "steps.docker-cache.outputs.cache-hit == 'true'"
        run: docker load -i /tmp/tempo-image.tar

      - name: Pull and cache Tempo image
        if: "steps.docker-cache.outputs.cache-hit != 'true'"
        run: |
          docker pull ghcr.io/tempoxyz/tempo:latest
          docker save ghcr.io/tempoxyz/tempo:latest -o /tmp/tempo-image.tar

      - name: Run tests
        run: pnpm test --bail=1
        env:
          CI: true
          VITE_NODE_TAG: latest
          VITE_RPC_CREDENTIALS: ${{ secrets.VITE_RPC_CREDENTIALS }}
