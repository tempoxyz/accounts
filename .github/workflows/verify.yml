name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies # zizmor: ignore[self-repository] actionlint does not support $/ references yet.

      - name: Cache turbo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo/cache
          key: turbo-checks-${{ github.sha }}
          restore-keys: turbo-checks-

      - name: Select affected packages
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "${BASE//0/}" ] && git merge-base --is-ancestor "$BASE" HEAD 2> /dev/null; then
            echo "TURBO_SCM_BASE=$BASE" >> "$GITHUB_ENV"
            echo "AFFECTED=true" >> "$GITHUB_ENV"
          fi

      - name: Audit dependencies
        run: pnpm audit

      - name: Check code
        run: pnpm check

      - name: Check types
        run: pnpm exec tsc -b --noEmit

      - name: Check workspaces
        run: pnpm turbo run check:types check:markdown --filter='!accounts' ${AFFECTED:+--affected}

      - name: Prune turbo cache
        run: find .turbo/cache -type f -mtime +3 -delete

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TESTCONTAINERS_RYUK_DISABLED: true

    steps:
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies # zizmor: ignore[self-repository] actionlint does not support $/ references yet.

      - name: Cache turbo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo/cache
          key: turbo-test-${{ github.sha }}
          restore-keys: turbo-test-

      - name: Select affected packages
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "${BASE//0/}" ] && git merge-base --is-ancestor "$BASE" HEAD 2> /dev/null; then
            echo "TURBO_SCM_BASE=$BASE" >> "$GITHUB_ENV"
            echo "AFFECTED=true" >> "$GITHUB_ENV"
          fi

      - name: Resolve Tempo image digest
        id: tempo-digest
        run: |
          digest=$(docker manifest inspect ghcr.io/tempoxyz/tempo:latest -v 2>/dev/null | jq -r '.[0].Descriptor.digest // .Descriptor.digest' 2>/dev/null || docker buildx imagetools inspect ghcr.io/tempoxyz/tempo:latest --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Cache Tempo Docker image
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: docker-cache
        with:
          path: /tmp/tempo-image.tar
          key: tempo-image-${{ steps.tempo-digest.outputs.digest }}

      - name: Load cached Tempo image
        if: "steps.docker-cache.outputs.cache-hit == 'true'"
        run: docker load -i /tmp/tempo-image.tar

      - name: Pull and cache Tempo image
        if: "steps.docker-cache.outputs.cache-hit != 'true'"
        run: |
          docker pull ghcr.io/tempoxyz/tempo:latest
          docker save ghcr.io/tempoxyz/tempo:latest -o /tmp/tempo-image.tar

      - name: Run tests
        run: pnpm turbo run test ${AFFECTED:+--affected} -- --bail=1
        env:
          CI: true
          TEMPO_IMAGE: ${{ steps.tempo-digest.outputs.digest }}
          VITE_NODE_TAG: latest
          VITE_RPC_CREDENTIALS: ${{ secrets.VITE_RPC_CREDENTIALS }}

      - name: Prune turbo cache
        run: find .turbo/cache -type f -mtime +3 -delete
