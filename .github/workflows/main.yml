# Releases the npm package on each push to main, and verifies the commit beside the release. The
# release needs no job of Verify, so a failed check or end-to-end test blocks no release.
name: Main
on:
  push:
    branches: [main]
  # Releases main's tip now, even when its commits change only CI or tests.
  workflow_dispatch:

jobs:
  # Each release waits for the earlier ones, in push order, so none cancels a publish. The default
  # queue keeps only one pending job, so `max` keeps every one.
  release:
    concurrency:
      cancel-in-progress: false
      group: ${{ github.workflow }}-release
      queue: max
    name: Release
    # A called workflow's jobs get only what the caller grants. `contents: write` creates the GitHub
    # release.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml # zizmor: ignore[self-repository]

  # A squash commit's tree can differ from the one that its pull request verified, since main can
  # move between that run and the merge. No job needs this one.
  verify:
    name: Verify
    # A called workflow's jobs get only what the caller grants. The end-to-end job pulls private
    # images. The proof job runs only for a pull request, and GitHub refuses a called workflow whose
    # job declares a permission that the caller does not grant, also a job that it skips.
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
    uses: ./.github/workflows/verify.yml # zizmor: ignore[self-repository]

permissions: {}
