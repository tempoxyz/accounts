name: Main
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {} # each job defines the minimum permissions it needs

jobs:
  verify:
    name: Verify
    permissions:
      contents: read # to clone repository contents in the reusable workflow
      id-token: write # to initialize secure-runner in the reusable workflow
    uses: ./.github/workflows/verify.yml
    secrets:
      VITE_RPC_CREDENTIALS: ${{ secrets.VITE_RPC_CREDENTIALS }}

  version:
    name: Version
    needs: verify
    outputs:
      hasChangesets: ${{ steps.changesets.outputs['has-changesets'] }}
    # The release commits and pull request are created through the GitHub API
    # with a short-lived GitHub App token minted via the github-sts action
    # (authorized by .github/sts/changesets.sts.yaml); the built-in
    # GITHUB_TOKEN is not allowed to create pull requests.
    permissions:
      contents: read # to clone repository contents
      id-token: write # to request the OIDC token the STS exchange verifies
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@ee2960a6cc25d99bda45614135bfe1197d879bac # 2026-09-26T06-46-03Z-ee2960a6

      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          skip-cache: 'true' # avoid cache poisoning attacks

      - name: Fetch GitHub token via STS
        id: sts
        uses: tempoxyz/gh-actions/actions/github-sts@ee2960a6cc25d99bda45614135bfe1197d879bac # 2026-09-26T06-46-03Z-ee2960a6
        with:
          policy: changesets

      - name: Create or update release pull request
        id: changesets
        uses: tempoxyz/gh-actions/vendor/changesets/action@ee2960a6cc25d99bda45614135bfe1197d879bac # 2026-09-26T06-46-03Z-ee2960a6
        with:
          github-token: ${{ steps.sts.outputs.token }}
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          version-script: pnpm changeset:version

  publish:
    name: Publish
    if: needs.version.outputs.hasChangesets == 'false'
    needs: version
    permissions:
      contents: write # to create the GitHub release and tag
      id-token: write # to use npm trusted publishing through OIDC
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 5

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@ee2960a6cc25d99bda45614135bfe1197d879bac # 2026-09-26T06-46-03Z-ee2960a6

      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          skip-cache: 'true' # avoid cache poisoning attacks

      - name: Publish to npm
        uses: tempoxyz/gh-actions/vendor/changesets/action@ee2960a6cc25d99bda45614135bfe1197d879bac # 2026-09-26T06-46-03Z-ee2960a6
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        with:
          create-github-releases: true
          publish-script: pnpm changeset:publish
