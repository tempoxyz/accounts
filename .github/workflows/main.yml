name: Main
on:
  push:
    branches: [main]

# No workflow-level concurrency: every pushed commit gets its own Verify run, so
# a newer push never cancels an older commit's checks. Only the jobs that release
# or deploy are serialized.

permissions: {} # each job defines the minimum permissions it needs

jobs:
  verify:
    name: Verify
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
    with:
      full: true
    secrets:
      VITE_RPC_CREDENTIALS: ${{ secrets.VITE_RPC_CREDENTIALS }}

  deploy-workers:
    name: Deploy Workers
    needs: verify
    concurrency:
      group: main-deploy-workers
      cancel-in-progress: false
    permissions:
      actions: read # to find the last successful deploy
      contents: read
      pull-requests: write # requested by the reusable workflow for preview comments
    uses: ./.github/workflows/deploy-workers.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  version:
    name: Version
    concurrency:
      group: main-version
      cancel-in-progress: false
    outputs:
      hasChangesets: ${{ steps.changesets.outputs['has-changesets'] }}
    # The release commits and pull request are created through the GitHub API
    # with a short-lived GitHub App token minted via the github-sts action
    # (authorized by .github/sts/changesets.sts.yaml); the built-in
    # GITHUB_TOKEN is not allowed to create pull requests.
    permissions:
      contents: read # to clone repository contents
      id-token: write # to request the OIDC token the STS exchange verifies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
        with:
          skip-cache: 'true' # avoid cache poisoning attacks

      - name: Fetch GitHub token via STS
        id: sts
        uses: tempoxyz/gh-actions/actions/github-sts@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          policy: changesets

      - name: Create or update release pull request
        id: changesets
        uses: tempoxyz/gh-actions/vendor/changesets/action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          github-token: ${{ steps.sts.outputs.token }}
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          version-script: pnpm changeset:version

  publish:
    name: Publish
    if: needs.version.outputs.hasChangesets == 'false'
    needs: [verify, version]
    concurrency:
      group: main-publish
      cancel-in-progress: false
    permissions:
      contents: write # to create the GitHub release and tag
      id-token: write # to use npm trusted publishing through OIDC
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 15

    steps:
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
        with:
          skip-cache: 'true' # avoid cache poisoning attacks

      - name: Publish to npm
        uses: tempoxyz/gh-actions/vendor/changesets/action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        with:
          create-github-releases: true
          publish-script: pnpm changeset:publish
