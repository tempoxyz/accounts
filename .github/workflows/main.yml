name: Main
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {} # each job defines the minimum permissions it needs

jobs:
  verify:
    name: Verify
    permissions:
      contents: read # to clone repository contents in the reusable workflow
      id-token: write # to initialize secure-runner in the reusable workflow
    uses: ./.github/workflows/verify.yml
    secrets:
      VITE_RPC_CREDENTIALS: ${{ secrets.VITE_RPC_CREDENTIALS }}

  version:
    name: Version
    needs: verify
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    # The release commits (commitMode: github-api) and the release pull
    # request are created with a short-lived GitHub App token minted via the
    # github-sts action (authorized by .github/sts/changesets.sts.yaml); the
    # built-in GITHUB_TOKEN is not allowed to create pull requests.
    permissions:
      contents: read # to clone repository contents
      id-token: write # to request the OIDC token the STS exchange verifies
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@0a60d757d0f4725a34f22f7b9ebf7b91b4b00bcf

      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          skip-cache: 'true' # avoid cache poisoning attacks

      - name: Fetch GitHub token via STS
        id: sts
        uses: tempoxyz/gh-actions/actions/github-sts@0a60d757d0f4725a34f22f7b9ebf7b91b4b00bcf # main
        with:
          policy: changesets

      - name: Create or update release pull request
        id: changesets
        uses: tempoxyz/gh-actions/vendor/changesets/action@0a60d757d0f4725a34f22f7b9ebf7b91b4b00bcf
        with:
          commitMode: github-api
          title: 'chore: version packages'
          commit: 'chore: version packages'
          version: pnpm changeset:version
        env:
          GITHUB_TOKEN: ${{ steps.sts.outputs.token }}

  publish:
    name: Publish
    if: needs.version.outputs.hasChangesets == 'false'
    needs: version
    permissions:
      contents: write # to create releases and tags through changesets/action
      id-token: write # to use npm trusted publishing through OIDC
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 5

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@0a60d757d0f4725a34f22f7b9ebf7b91b4b00bcf

      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          skip-cache: 'true' # avoid cache poisoning attacks

      - name: Publish to npm
        uses: tempoxyz/gh-actions/vendor/changesets/action@0a60d757d0f4725a34f22f7b9ebf7b91b4b00bcf
        with:
          publish: pnpm changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
