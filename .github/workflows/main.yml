# Releases the npm packages on each push to main. Its pull request already ran Verify, so a push to
# main does not run it again.
name: Main
on:
  push:
    branches: [main]

jobs:
  # Each release waits for the earlier ones, in push order, so none cancels a publish. The default
  # queue keeps only one pending job, so `max` keeps every one.
  release:
    concurrency:
      cancel-in-progress: false
      group: ${{ github.workflow }}-release
      queue: max
    name: Release
    # A called workflow's jobs get only what the caller grants, also those that skip on push.
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    secrets: inherit
    uses: ./.github/workflows/release.yml

permissions: {}
