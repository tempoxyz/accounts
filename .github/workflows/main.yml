name: Main
on:
  push:
    branches: [main]

# Pushes run in push order: a newer push replaces a waiting run, so the newest commit
# is always the one that deploys and publishes next. Re-runs get their own group, so
# re-running an older run never replaces the newest commit's waiting run, and a re-run
# deploys or publishes only while its commit is still the tip of main (verify's ship).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_attempt == '1' && 'push' || github.sha }}
  cancel-in-progress: false

permissions: {} # each job defines the minimum permissions it needs

jobs:
  # Verify runs on every push on its own (verify.yml); this waits for its result on
  # this commit, so nothing reaches npm or production unless it passed.
  verify:
    name: Verify
    permissions:
      actions: read # to read this commit's Verify run
      contents: read # to read main's tip
    outputs:
      ship: ${{ steps.tip.outputs.ship }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wait for Verify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          while :; do
            run="$(gh run list --repo "$REPO" --workflow verify.yml --commit "$SHA" --event push --limit 1 \
              --json status,conclusion,url --jq '.[0] // empty')" || run=''
            if [ -n "$run" ] && [ "$(jq -r .status <<< "$run")" = completed ]; then
              conclusion="$(jq -r .conclusion <<< "$run")"
              [ "$conclusion" = success ] && exit 0
              echo "::error::Verify $conclusion on $SHA: $(jq -r .url <<< "$run")"
              exit 1
            fi
            sleep 30
          done

      # A re-run of an older run must not deploy or publish over newer commits, so a
      # re-run ships only while its commit is still main's tip.
      - name: Check main's tip
        id: tip
        env:
          ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ship=true
          if [ "$ATTEMPT" != 1 ] && [ "$(gh api "repos/$REPO/commits/main" --jq .sha)" != "$SHA" ]; then
            ship=false
            echo "::notice::Not deploying or publishing: main has moved past $SHA."
          fi
          echo "ship=$ship" >> "$GITHUB_OUTPUT"

  deploy-workers:
    name: Deploy Workers
    if: needs.verify.outputs.ship == 'true'
    needs: verify
    permissions:
      actions: read # to find the last successful deploy
      contents: read
      pull-requests: write # requested by the reusable workflow for preview comments
    uses: ./.github/workflows/deploy-workers.yml # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  version:
    name: Version
    outputs:
      hasChangesets: ${{ steps.changesets.outputs['has-changesets'] }}
    # The release commits and pull request are created through the GitHub API
    # with a short-lived GitHub App token minted via the github-sts action
    # (authorized by .github/sts/changesets.sts.yaml); the built-in
    # GITHUB_TOKEN is not allowed to create pull requests.
    permissions:
      contents: read # to clone repository contents
      id-token: write # to request the OIDC token the STS exchange verifies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
        with:
          skip-cache: 'true' # avoid cache poisoning attacks

      - name: Fetch GitHub token via STS
        id: sts
        uses: tempoxyz/gh-actions/actions/github-sts@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          policy: changesets

      - name: Create or update release pull request
        id: changesets
        uses: tempoxyz/gh-actions/vendor/changesets/action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          github-token: ${{ steps.sts.outputs.token }}
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          version-script: pnpm changeset:version

  publish:
    name: Publish
    if: needs.verify.outputs.ship == 'true' && needs.version.outputs.hasChangesets == 'false'
    needs: [verify, version]
    permissions:
      contents: write # to create the GitHub release and tag
      id-token: write # to use npm trusted publishing through OIDC
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 15

    steps:
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies # zizmor: ignore[self-repository] actionlint does not support $/ references yet.
        with:
          skip-cache: 'true' # avoid cache poisoning attacks

      - name: Publish to npm
        uses: tempoxyz/gh-actions/vendor/changesets/action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        with:
          create-github-releases: true
          publish-script: pnpm changeset:publish
