name: Deploy Workers
on:
  pull_request:
  workflow_dispatch:
  # Main calls this for pushes to main once Verify passes, so production only
  # gets commits whose checks and tests passed.
  workflow_call:
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true

concurrency:
  group: deploy-workers-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  deploy:
    name: ${{ github.event_name == 'pull_request' && 'Preview' || 'Deploy' }}
    # Fork and Dependabot pull requests have no Cloudflare credentials to upload previews with.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # to find the last successful deploy
      contents: read
      pull-requests: write # to comment preview URLs
    env:
      VITE_WALLET_HOST: https://wallet.tempo.xyz/embed
      VITE_ENV: mainnet
      VITE_TURNKEY_ORGANIZATION_ID: 1562c50f-1a48-4b10-8f42-87df4e8ef01d
      VITE_TURNKEY_AUTH_PROXY_CONFIG_ID: eab55ad4-b2f4-414f-836b-a5e279f01ed2
      VITE_PRIVY_APP_ID: cmixx4jol01zgl80cgjenqkps
      VITE_PRIVY_CLIENT_ID: client-WY6TQmgzdwgp2ZkrEXJBDscCamyaXNyXrTYoVRkMYm2rk

    steps:
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies # zizmor: ignore[self-repository] actionlint does not support $/ references yet.

      - name: Restore turbo cache
        id: turbo-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .turbo/cache
          key: turbo-deploy-${{ github.sha }}
          restore-keys: turbo-deploy-

      # Pushes deploy what changed since the last push whose Deploy step succeeded, whatever
      # its run's other jobs did, so changes from a superseded, failed or unverified run are
      # not skipped. Before Main called this workflow, deploys were its own push runs.
      # Falls back to every worker.
      # A re-run of a commit that is no longer main's tip deploys nothing, so it cannot roll
      # production back; first attempts already run in push order, and a push that moves
      # main back still deploys.
      - name: Select affected workers
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ATTEMPT: ${{ github.run_attempt }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          base="$BASE"
          if [ "$EVENT" = push ]; then
            base=''
            last=''
            ids="$(gh run list --repo "$REPO" --workflow main.yml --branch main --event push --limit 20 --json databaseId,headSha \
              --jq 'map(select(.headSha != env.SHA))[].databaseId')" || ids=''
            for id in $ids; do
              run="$(gh run view "$id" --repo "$REPO" --json headSha,jobs \
                --jq '[.headSha, ([.jobs[] | select(.name | endswith("Deploy")) | .steps[] | select(.name == "Deploy") | .conclusion // "running"] | first // "none")] | @tsv')" || continue
              read -r head deploy <<< "$run"
              [ -n "$last" ] || [ "$deploy" != success ] || last="$head"
            done
            if [ -z "$last" ]; then
              last="$(gh run list --repo "$REPO" --workflow deploy-workers.yml --branch main --event push --status success --limit 20 --json event,headSha \
                --jq 'map(select(.event != "pull_request" and .headSha != env.SHA))[0].headSha // empty')" || last=''
            fi
            if [ "$ATTEMPT" != 1 ]; then
              tip="$(gh api "repos/$REPO/commits/main" --jq .sha)" || exit 1
              [ "$tip" = "$SHA" ] || echo "STALE=true" >> "$GITHUB_ENV"
            fi
            base="${last:-$base}"
          fi
          if [ -n "${base//0/}" ] && git merge-base --is-ancestor "$base" HEAD 2> /dev/null; then
            echo "TURBO_SCM_BASE=$base" >> "$GITHUB_ENV"
            echo "AFFECTED=true" >> "$GITHUB_ENV"
          fi

      - name: Deploy
        if: github.event_name != 'pull_request' && env.STALE != 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm turbo run deploy --continue=dependencies-successful ${AFFECTED:+--affected}

      - name: Preview
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_DIRECTORY: ${{ runner.temp }}/wrangler
        run: pnpm turbo run deploy:preview --continue=dependencies-successful ${AFFECTED:+--affected}

      # Upserts one sticky comment, found by its marker, and removes older copies.
      - name: Comment on pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          OUTPUT: ${{ runner.temp }}/wrangler
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$OUTPUT"/*.json)
          [ ${#files[@]} -gt 0 ] || exit 0
          marker='<!-- pr-comment: deploy-workers -->'
          body="$RUNNER_TEMP/deploy-workers-comment.md"
          {
            printf '| Worker | Preview |\n|--------|---------|\n'
            jq -r 'select(.type == "version-upload") | "| \(.worker_name) | \(.preview_url // "-") |"' "${files[@]}" | sort
            printf '\n%s\n' "$marker"
          } > "$body"
          ids="$(gh api "repos/$REPO/issues/$NUMBER/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id")"
          latest="$(printf '%s\n' "$ids" | sed '/^$/d' | tail -n 1)"
          if [ -n "$latest" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$latest" -F body=@"$body" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$NUMBER/comments" -F body=@"$body" > /dev/null
          fi
          for id in $(printf '%s\n' "$ids" | sed '/^$/d' | head -n -1); do
            gh api -X DELETE "repos/$REPO/issues/comments/$id"
          done

      - name: Prune turbo cache
        run: find .turbo/cache -type f -mtime +3 -delete

      - name: Save turbo cache
        if: github.ref == 'refs/heads/main' && steps.turbo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}
