name: Deploy Workers
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-workers-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

jobs:
  deploy:
    name: ${{ matrix.worker.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
      id-token: write
      pull-requests: write

    strategy:
      matrix:
        worker:
          - name: Playground
            directory: playgrounds/web
            build-env: |
              VITE_WALLET_HOST=https://wallet.tempo.xyz/embed
              VITE_ENV=mainnet
              VITE_TURNKEY_ORGANIZATION_ID=1562c50f-1a48-4b10-8f42-87df4e8ef01d
              VITE_TURNKEY_AUTH_PROXY_CONFIG_ID=eab55ad4-b2f4-414f-836b-a5e279f01ed2
              VITE_PRIVY_APP_ID=cmixx4jol01zgl80cgjenqkps
              VITE_PRIVY_CLIENT_ID=client-WY6TQmgzdwgp2ZkrEXJBDscCamyaXNyXrTYoVRkMYm2rk
          - name: Wagmi
            directory: playgrounds/wagmi

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@d39baa2b43f5eba5d261c047521a4fbd56101129 # 2026-09-23T04-31-11Z-d39baa2b

      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Build accounts
        run: pnpm build

      - name: Configure build environment
        if: matrix.worker.build-env != ''
        run: printf '%s\n' "$BUILD_ENV" >> "$GITHUB_ENV"
        env:
          BUILD_ENV: ${{ matrix.worker.build-env }}

      - name: Build
        working-directory: ${{ matrix.worker.directory }}
        run: pnpm build

      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: tempoxyz/gh-actions/vendor/cloudflare/wrangler-action@d39baa2b43f5eba5d261c047521a4fbd56101129 # 2026-09-23T04-31-11Z-d39baa2b
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ matrix.worker.directory }}

      - name: Preview
        id: preview
        if: github.event_name == 'pull_request'
        uses: tempoxyz/gh-actions/vendor/cloudflare/wrangler-action@d39baa2b43f5eba5d261c047521a4fbd56101129 # 2026-09-23T04-31-11Z-d39baa2b
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ matrix.worker.directory }}
          command: versions upload

      - name: Preview URL
        if: github.event_name == 'pull_request'
        uses: tempoxyz/gh-actions/actions/pr-comment@d39baa2b43f5eba5d261c047521a4fbd56101129 # 2026-09-23T04-31-11Z-d39baa2b
        with:
          header: deploy-${{ matrix.worker.name }}
          message: |
            | Worker | Preview |
            |--------|---------|
            | ${{ matrix.worker.name }} | ${{ steps.preview.outputs.deployment-url }} |
