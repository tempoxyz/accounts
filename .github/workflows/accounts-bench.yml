name: Accounts Bench
on:
  pull_request:
    paths:
      - .github/workflows/accounts-bench.yml
      - bench/**
      - pnpm-lock.yaml
      - src/**
  workflow_dispatch:
    inputs:
      runs:
        default: '5'
        description: Runs per renderer
        required: false

concurrency:
  group: accounts-bench-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  bench:
    name: Bench
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c

      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The baseline: main's SDK source (the PR's base commit), built with this
      # PR's bench app so both sides run the same harness.
      - name: Clone base SDK
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: base
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          sparse-checkout: src

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies # zizmor: ignore[self-repository] actionlint does not support $/ references yet.

      # Both apps share one origin, since the wallet treats a new origin differently.
      - name: Build bench apps
        run: |
          pnpm --filter bench build
          ACCOUNTS_SRC="$GITHUB_WORKSPACE/base/src" pnpm --filter bench exec vp build --base /base/ --outDir dist/base --emptyOutDir

      # Serves both apps locally and benchmarks them against the live Tempo Wallet
      # on Tempo Testnet, with the runner's preinstalled Chrome.
      - name: Run bench
        working-directory: bench
        env:
          BENCH_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          BENCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUNS: ${{ inputs.runs || '5' }}
        run: |
          pnpm preview > preview.log 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://localhost:5180/base/ > /dev/null && break; sleep 1; done
          if ! curl -fsS http://localhost:5180 > /dev/null || ! curl -fsS http://localhost:5180/base/ > /dev/null; then
            echo "::error::The bench app preview did not start."
            cat preview.log
            exit 1
          fi
          BENCH_BASE_COMMIT="$(git -C ../base rev-parse HEAD)" pnpm bench --runs "$RUNS" --baseline http://localhost:5180/base/ --json samples.json --markdown report.md

      - name: Write job summary
        if: ${{ !cancelled() && hashFiles('bench/report.md') != '' }}
        run: cat bench/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('bench/report.md') != '' }}
        uses: tempoxyz/gh-actions/actions/pr-comment@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
        with:
          # The marker of the sticky comment. Changing it posts a new comment.
          header: ux-bench
          path: bench/report.md
