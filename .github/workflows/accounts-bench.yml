name: Accounts Bench
on:
  pull_request:
    paths:
      - .github/workflows/accounts-bench.yml
      - bench/**
      - pnpm-lock.yaml
      - src/**
  workflow_dispatch:
    inputs:
      runs:
        default: '5'
        description: Runs per renderer
        required: false
      host:
        default: ''
        description: Wallet page for the Tempo Wallet renderers (e.g. a wallet PR preview's /post-message). Default is wallet.tempo.xyz.
        required: false

concurrency:
  group: accounts-bench-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  bench:
    name: Bench
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The baseline: main's SDK source (the PR's base commit), built with this
      # PR's bench app so both sides run the same harness.
      - name: Clone base SDK
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: base
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          sparse-checkout: src

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies # zizmor: ignore[self-repository] actionlint does not support $/ references yet.

      # Both apps share one origin, since the wallet treats a new origin differently.
      - name: Build bench apps
        run: |
          pnpm --filter bench build
          ACCOUNTS_SRC="$GITHUB_WORKSPACE/base/src" pnpm --filter bench exec vp build --base /base/ --outDir dist/base --emptyOutDir

      # Serves both apps locally and benchmarks them against the live Tempo Wallet
      # on Tempo Testnet, with the runner's preinstalled Chrome.
      - name: Run bench
        working-directory: bench
        env:
          BENCH_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          BENCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HOST: ${{ inputs.host }}
          RUNS: ${{ inputs.runs || '5' }}
        run: |
          pnpm preview > preview.log 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://localhost:5180/base/ > /dev/null && break; sleep 1; done
          if ! curl -fsS http://localhost:5180 > /dev/null || ! curl -fsS http://localhost:5180/base/ > /dev/null; then
            echo "::error::The bench app preview did not start."
            cat preview.log
            exit 1
          fi
          BENCH_BASE_COMMIT="$(git -C ../base rev-parse HEAD)" pnpm bench --runs "$RUNS" --baseline http://localhost:5180/base/ --json samples.json --markdown report.md ${HOST:+--host "$HOST"}

      - name: Write job summary
        if: ${{ !cancelled() && hashFiles('bench/report.md') != '' }}
        run: cat bench/report.md >> "$GITHUB_STEP_SUMMARY"

      # Upserts one sticky comment, found by its marker, and removes older copies.
      # The shared pr-comment action passes `--arg` to `gh api --jq`, which gh
      # rejects, so its lookup fails and it posts a new comment on every run.
      - name: Comment on pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('bench/report.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          marker='<!-- pr-comment: ux-bench -->'
          body="$RUNNER_TEMP/accounts-bench-comment.md"
          { cat bench/report.md; printf '\n%s\n' "$marker"; } > "$body"
          ids="$(gh api "repos/$REPO/issues/$NUMBER/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id")"
          latest="$(printf '%s\n' "$ids" | sed '/^$/d' | tail -n 1)"
          if [ -n "$latest" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$latest" -F body=@"$body" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$NUMBER/comments" -F body=@"$body" > /dev/null
          fi
          for id in $(printf '%s\n' "$ids" | sed '/^$/d' | head -n -1); do
            gh api -X DELETE "repos/$REPO/issues/comments/$id"
          done
