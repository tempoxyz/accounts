# Measures each entry's browser bundle on a pull request, and compares it with the base commit. The
# measure job runs the pull request's code without write access. The comment job runs none of it, and
# alone may write the pull request's comment.
name: Size
on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

jobs:
  measure:
    name: Measure
    # The secure-runner action authenticates with an OIDC token.
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Clone base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .size-base
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies # zizmor: ignore[self-repository]

      # The pull request's script measures the base commit too, so both use the same cases. A base
      # commit that the script cannot measure leaves the report without changes.
      - name: Measure base commit
        run: |
          mkdir -p .size-base/scripts
          cp scripts/size.ts .size-base/scripts/size.ts
          cd .size-base
          if pnpm install --frozen-lockfile && node scripts/size.ts --json "$RUNNER_TEMP/base.json"; then
            echo "Measured the base commit."
          else
            rm -f "$RUNNER_TEMP/base.json"
            echo "::warning::The base commit could not be measured, so the report shows no changes."
          fi

      - name: Measure pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/size"
          base=()
          if [ -f "$RUNNER_TEMP/base.json" ]; then
            base=(--base "$RUNNER_TEMP/base.json")
            against="Changes are against the base commit \`${BASE_SHA:0:7}\`."
          else
            against="The base commit could not be measured, so the table shows no changes."
          fi
          node scripts/size.ts "${base[@]}" --markdown "$RUNNER_TEMP/table.md"
          {
            echo '<!-- accounts-size -->'
            echo '## Bundle size'
            echo
            echo "Each case bundles a small app with Rolldown at \`${HEAD_SHA:0:7}\`: minified ESM for the browser, with code splitting. Each size is Brotli at quality 11. The initial load is the entry chunk and its static imports. $against"
            echo
            cat "$RUNNER_TEMP/table.md"
            echo
            cat <<'EOF'
          Run `pnpm size` to reproduce, and `pnpm size --inputs <case>` to list the modules of a case.
          EOF
          } > "$RUNNER_TEMP/size/comment.md"
          cat "$RUNNER_TEMP/size/comment.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: size
          path: ${{ runner.temp }}/size/comment.md
          retention-days: 1

  # A pull request from a fork receives a read-only token, so its report stays in the job summary.
  comment:
    name: Comment
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: measure
    permissions:
      id-token: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Download report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: size
          path: ${{ runner.temp }}/size

      # One comment per pull request, which each run updates.
      - name: Write comment
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          body="$RUNNER_TEMP/size/comment.md"
          id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- accounts-size -->"))) | .id' | head -n 1)"
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$body" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" -F "body=@$body" > /dev/null
          fi

permissions: {}
