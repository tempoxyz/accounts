# Deploys the documentation site of `site/` to the production Cloudflare account. A push to main
# deploys the Worker through the Cloudflare Deploy Broker, and no job of the push holds a Cloudflare
# token. A pull request's build job builds the site and bundles the Worker without secrets, and
# deploys nothing. The Worker implements a Durable Object, so Cloudflare gives it no preview URL.
name: Site
on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

# The broker completes the work of a cancelled job, so a run on main is never cancelled. A newer
# pending run still replaces an older pending one.
concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  # The trusted build workflow of the broker builds the site, bundles the Worker of `src/server/`, and
  # attests the Worker, `wrangler.json`, and the files of `dist/public`, without a Cloudflare token.
  # The broker's `accounts` policy admits only this workflow on main.
  attest:
    name: Attest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # The called workflow grants its job these permissions: it signs the attestations with an OIDC
    # token, writes them and the artifact, and reads the repository.
    permissions:
      actions: write
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: tempoxyz/gh-actions/.github/workflows/cloudflare-deploy-broker-build.yml@1a535d662a51f211d750307541069cb849535414 # 2026-11-19T07-33-38Z-1a535d66
    with:
      artifact-name: accounts-site
      build-command: pnpm build
      install-directory: .
      working-directory: site
      wrangler-config: wrangler.json

  build:
    name: Build
    if: github.event_name == 'pull_request'
    # The secure-runner action authenticates with an OIDC token.
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      # A pull request builds its head commit, not the merge ref, since the merge commit is not
      # pushed. The source links of the site name the commit that the build checks out.
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies # zizmor: ignore[self-repository]

      - name: Build site
        run: pnpm --dir site build

      # The dry run bundles the Worker of `src/server/` and reads `wrangler.json`, so a fault of
      # either fails the pull request before main deploys it.
      - name: Bundle Worker
        working-directory: site
        run: pnpm exec wrangler deploy --dry-run --outdir dist/worker

  # The broker uploads the attested version, promotes it, and checks Cloudflare's readback. The
  # Worker keeps its secrets and its KV namespace.
  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: attest
    # The secure-runner action and the broker authenticate with an OIDC token.
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557

      - name: Deploy site
        id: deploy
        uses: tempoxyz/gh-actions/actions/cloudflare-deploy-broker@1a535d662a51f211d750307541069cb849535414 # 2026-11-19T07-33-38Z-1a535d66
        with:
          archive-digest: ${{ needs.attest.outputs.archive-digest }}
          artifact-id: ${{ needs.attest.outputs.artifact-id }}
          deployment-id: accounts-site
          module-digest: ${{ needs.attest.outputs.module-digest }}

      # The verification URL is `accounts.tempo.xyz`, the Worker's custom domain. The check thus
      # reaches the new version through the domain.
      - name: Check deployment
        env:
          URL: ${{ steps.deploy.outputs.verification-url }}
        run: |
          # Only a 200 proves the page is public. Access answers a visitor that no policy admits with
          # a 302 to its sign-in page, which `--fail` accepts.
          status=$(curl --fail --output /dev/null --retry 10 --retry-all-errors --retry-delay 6 --show-error --silent --write-out '%{http_code}' "$URL/")
          [[ "$status" == 200 ]] || { echo "::error::$URL/ answered $status, not 200." >&2; exit 1; }

          # The tempo.xyz zone redirects plain HTTP to HTTPS. Without the redirect, a route of `/api/`
          # would name an `http:` client ID.
          redirect=$(curl --output /dev/null --retry 10 --retry-all-errors --retry-delay 6 --show-error --silent --write-out '%{http_code} %{redirect_url}' "http://${URL#https://}/")
          case "$redirect" in
            "301 $URL/" | "308 $URL/") ;;
            *) echo "::error::http://${URL#https://}/ answered '$redirect', not a redirect to $URL/." >&2; exit 1 ;;
          esac
          printf 'The site runs at [%s](%s).\n' "$URL" "$URL" >> "$GITHUB_STEP_SUMMARY"

permissions: {}
