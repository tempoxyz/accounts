name: 'Install dependencies'
description: 'Prepare repository and all dependencies'

runs:
  using: 'composite'
  steps:
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Set up pnpm
      # The organization allows only GitHub-owned actions, so pnpm comes from npm at the pinned version.
      shell: bash
      run: npm install --global "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")" # zizmor: ignore[adhoc-packages]

    - name: Locate pnpm store
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    # A cached store keeps each job from downloading every tarball from the registry again.
    - name: Cache pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        path: ${{ steps.pnpm-store.outputs.path }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
