<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accounts Bench</title>
  </head>
  <body>
    <h1>Accounts Bench</h1>
    <p id="config"></p>
    <p>
      <button id="register" type="button">Register</button>
      <button id="login" type="button">Log in</button>
    </p>
    <p>
      <button id="register-siwe" type="button">Register + SIWE</button>
      <button id="register-key" type="button">Register + access key</button>
      <button id="register-siwe-key" type="button">Register + SIWE + access key</button>
    </p>
    <p>
      <button id="login-siwe" type="button">Log in + SIWE</button>
      <button id="login-key" type="button">Log in + access key</button>
      <button id="login-siwe-key" type="button">Log in + SIWE + access key</button>
    </p>
    <p>
      <button id="fund" type="button">Fund</button>
      <button id="send" type="button">Send transaction</button>
      <button id="disconnect" type="button">Disconnect</button>
      <button id="clear" type="button">Clear log</button>
    </p>
    <pre id="state"></pre>
    <pre id="log"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
