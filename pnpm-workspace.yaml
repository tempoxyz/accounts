  # Vite+ plugins and `vp dev` need Vite+'s core in place of Vite, as Void's Vite+ template sets.
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.6.0
  vocs: 2.12.0
  wagmi: 3.7.9
  waku: 1.0.0-rc.5
  wrangler: 4.161.0
  xstate: 5.33.4
  zile: 0.0.29
  zod: 4.6.7

catalogs:
  # The examples run Vite itself, since a copy of an example installs it. The site and the test apps
  # run it too. The default catalog's `vite` is Vite+'s core, which has no `vite` command.
  examples:
    vite: 8.3.8
  # React Native 0.88 needs React 19.3, and the mobile example names React 19.3.1, so it pins its own React.
  mobile:
    '@types/react': 19.3.0
    react: 19.3.1

minimumReleaseAgeExclude:
  # mppx 0.19.0 verifies and sends Tempo ID identity (mppx/extensions/identity/tempo).
  - mppx@0.19.0
  # ox 0.14.67 splits the WebAuthn data of a signature envelope in linear time (wevm/ox#677).
  - ox@0.14.67
  # Viem 2.58.8 approves a stored configurable account operation by its hash alone, with the owner as
  # `account` (wevm/viem#5675). It keeps 2.58.6's linear-time SIWE parse (wevm/viem#5609) and its
  # ox 0.14.67 WebAuthn envelope parse.
  - viem@2.58.8

