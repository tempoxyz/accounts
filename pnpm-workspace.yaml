auditConfig:
  ignoreGhsas:
    - GHSA-rmmr-r34h-pfm5 # affected versions have been removed from npm.
    - GHSA-w5hq-g745-h8pq # transitive Expo xcode uuid usage; no direct runtime exposure.
    - GHSA-qjx8-664m-686j # transitive Privy js-cookie usage in playground.
    - GHSA-h67p-54hq-rp68 # over-broad <=4.1.1 range flags terminal js-yaml@3.14.2 (v3 has no merge-key DoS, no later v3 to upgrade to); v4 deps already pinned to patched 4.2.0.

allowBuilds:
  '@reown/appkit': false
  bufferutil: false
  cloudflared: true
  cpu-features: true
  es5-ext: true
  esbuild: true
  keccak: false
  protobufjs: true
  sharp: true
  simple-git-hooks: true
  ssh2: true
  utf-8-validate: false
  workerd: true

blockExoticSubdeps: true

catalog:
  '@cloudflare/vite-plugin': ^1.31.2
  '@cloudflare/workers-types': ^4.20260317.1
  '@tanstack/react-query': ^5.97.0
  '@tanstack/react-router': ^1.168.19
  '@tanstack/react-start': ^1.166.7
  '@total-typescript/ts-reset': ^0.6.1
  '@types/node': ^25.6.0
  '@types/react': ^19.2.14
  '@types/react-dom': ^19.2.3
  '@vitejs/devtools': ^0.3.4
  '@vitejs/plugin-react': ^5.2.0
  '@wagmi/core': ^3.6.0
  hono: ^4.12.25
  mppx: ^0.8.6
  ox: 0.14.30
  prool: ~0.2.4
  react: ^19.2.5
  react-dom: ^19.2.5
  tsx: ^4.21.0
  typed-query-selector: ^2.12.1
  typescript: ^5.9.3
  viem: 2.54.6
  vite: ^8.0.16
  vite-plus: ~0.1.24
  vp: npm:vite-plus@~0.1.24
  wagmi: ^3.7.0
  wrangler: ^4.98.0
  zod: ^4.3.6

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@mermaid-js/*'
  - '@esbuild/*'
  - '@voidzero-dev/*'
  - '@wagmi/connectors'
  - '@wagmi/core'
  - esbuild
  - incur
  - mermaid
  - mppx
  - ox
  - wata
  - regen-ui
  - secretlint
  - tmp
  - vocs
  - viem
  - vite-plus
  - wagmi

nodeOptions: '--disable-warning=ExperimentalWarning --disable-warning=DeprecationWarning'

overrides:
  accounts: 'workspace:*'
  # GHSA-4x5r-pxfx-6jf8: @babel/core arbitrary file read via sourceMappingURL (7.29.1 unpublished; 7.29.6 is first patched release).
  '@babel/core@<=7.29.0': '7.29.6'
  '@grpc/grpc-js': '1.14.4'
  '@sinclair/typebox': '^0.34.0'
  'brace-expansion@>=5.0.0 <5.0.6': '5.0.6'
  # GHSA-rp9w-3fw7-7cwq et al: DOMPurify hook/config sanitization bypasses.
  'dompurify@<=3.4.10': '3.4.11'
  esbuild: '0.28.1'
  viem: 2.54.6
  file-type: '22.0.1'
  follow-redirects: '1.16.0'
  # GHSA-hmw2-7cc7-3qxx: form-data CRLF injection via unescaped field names.
  'form-data@>=4.0.0 <4.0.6': '4.0.6'
  # GHSA-88fw-hqm2-52qc (high, CORS reflects any Origin) + serve-static path traversal, AWS Lambda Set-Cookie/body-limit/header advisories. Forces transitive hono (mppx > @modelcontextprotocol/sdk) to the patched release.
  'hono@<4.12.25': '4.12.25'
  # GHSA-v6wh-96g9-6wx3: launch-editor NTLMv2 hash disclosure via UNC path (dev tooling).
  'launch-editor@<=2.14.0': '2.14.1'
  'js-cookie@<=3.0.5': '3.0.7'
  js-yaml@^3: '3.14.2'
  # GHSA-h67p-54hq-rp68: quadratic-complexity DoS in js-yaml v4 merge keys (4.1.2 unpublished; 4.2.0 is first patched release).
  js-yaml@4: '4.2.0'
  mermaid: '^11.14.1'
  ox: 0.14.30
  postcss: '8.5.14'
  protobufjs: '7.6.3'
  '@protobufjs/utf8': '1.1.1'
  qs: '6.15.2'
  # Pin to last version with npm provenance — 5.1.1 lost trust evidence.
  reselect: '5.1.0'
  # GHSA-w7jw-789q-3m8p: dev-tooling-only transitive (vite/react-native devtools).
  'shell-quote@>=1.1.0 <=1.8.3': '1.8.4'
  react: 'catalog:'
  react-dom: 'catalog:'
  tar: '7.5.16'
  'tmp@<0.2.7': '0.2.7'
  # GHSA-vmh5-mc38-953g + GHSA-38rv-x7px-6hhq + GHSA-pr7r-676h-xcf6: undici proxy TLS/cache/WebSocket advisories.
  'undici@>=7.0.0 <7.28.0': '7.28.0'
  'undici@>=8.0.0 <8.5.0': '8.5.0'
  'uuid@<11.1.1': '11.1.1'
  # GHSA-fx2h-pf6j-xcff: vite server.fs.deny bypass on Windows alternate paths (dev tooling).
  # Unconditional pin: range-keyed override does not rewrite `latest` importer specifiers (examples/basic).
  'vite@8': '8.0.16'
  vite-plus: 'catalog:'
  vp: 'catalog:'
  # GHSA-96hv-2xvq-fx4p: ws memory-exhaustion DoS (v8 prod path via viem; v7 dev path via react-native metro).
  'ws@>=7.0.0 <7.5.11': '7.5.11'
  'ws@>=8.0.0 <8.21.0': '8.21.0'
  wrangler: 'catalog:'

packages:
  - .
  - examples/*
  - playgrounds/*
  - ref-impls/*
  - site

peerDependencyRules:
  allowedVersions:
    accounts: '*'

shellEmulator: true

strictDepBuilds: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - '@noble/curves@1.8.0'
  - '@noble/hashes@1.7.0'
  - chokidar@4.0.3
  - jose@4.15.9
  - react-device-detect@2.2.3
  - semver@6.3.1
  - reselect@5.1.1
  - slow-redact@0.3.2
  - ua-parser-js@1.0.41
  - undici-types@6.19.8

patchedDependencies:
  vocs@2.0.0: patches/vocs@2.0.0.patch
