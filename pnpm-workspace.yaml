packages:
  - .
  - examples/*
  - playgrounds/*

auditConfig:
  ignoreGhsas:
    # Zod 4 is upgraded; Zod 3 has no fixed release. Backport its size gate below.
    # scripts/zod-security.test.ts guards the patch and all installed Zod versions.
    - GHSA-mrhx-c7xc-m3w5
    - GHSA-5p2g-fcmc-qvqq # metro's image-size v1 (1.2.1) build-tooling DoS; no patched v1, and metro passes file paths v2 rejects. vocs uses patched 2.0.4.
    - GHSA-w3rx-r6r6-pgpr # metro's image-size v1 (1.2.1) build-tooling DoS; no patched v1, and metro passes file paths v2 rejects. vocs uses patched 2.0.4.
    - GHSA-rmmr-r34h-pfm5 # affected versions have been removed from npm.
    - GHSA-w5hq-g745-h8pq # transitive Expo xcode uuid usage; no direct runtime exposure.
    - GHSA-qjx8-664m-686j # transitive Privy js-cookie usage in playground.
    - GHSA-h67p-54hq-rp68 # over-broad <=4.1.1 range flags terminal js-yaml@3.14.2 (v3 has no merge-key DoS, no later v3 to upgrade to); v4 deps already pinned to patched 4.2.0.
    - GHSA-vfj7-8cjw-p6xm # transitive glob/watch tooling DoS; patched braces 3.0.4 is not published on npm. Remove when available.
    - GHSA-gcqx-w48m-w2h4 # transitive Expo config deepmerge prototype poisoning; patched 4.3.2 is not published on npm. Remove when available.
    - GHSA-g3hv-75wg-m249 # minimatch 3.1.5 under glob 7 and test-exclude 6 (React Native codegen, rimraf, istanbul); they call minimatch() directly, which 11 removed. v5+ copies are overridden to 11.0.3.

allowBuilds:
  # testcontainers' Docker client runs without the native SSH and protobuf builds, as in Tempo ID.
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false
  workerd: true

catalog:
  '@changesets/cli': 2.31.0
  '@cloudflare/workers-types': 5.20261014.1
  '@hono/node-server': 2.1.5
  '@playwright/test': 1.63.0
  '@tanstack/react-query': 5.104.1
  '@types/node': 26.6.4
  '@types/pg': 8.23.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.2
  '@wagmi/core': 3.6.7
  esbuild: 0.28.2
  expo: 57.0.26
  expo-secure-store: 57.0.4
  expo-web-browser: 57.0.3
  hono: 4.13.13
  incur: 0.7.0
  jose: 6.2.12
  mppx: 0.12.0
  ox: 0.14.59
  pg: 8.23.1
  prool: 0.2.17
  react: 19.3.0
  react-dom: 19.3.0
  react-native: 0.86.3
  react-native-get-random-values: 1.11.0
  redis: 6.3.0
  testcontainers: 11.14.0
  tsx: 4.23.15
  typescript: 7.0.2
  viem: 2.57.12
  # Vite+ plugins and `vp dev` need Vite+'s core in place of Vite, as Void's Vite+ template sets.
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  wagmi: 3.7.9
  wrangler: 4.151.0
  xstate: 5.33.3
  zile: 0.0.29

catalogs:
  # The examples run Vite itself, since a copy of an example installs it. The default catalog's `vite`
  # is Vite+'s core, which has no `vite` command.
  examples:
    vite: 8.3.4
  # React Native 0.86 needs React 19.2, so the mobile playground pins its own React.
  mobile:
    '@types/react': 19.2.18
    react: 19.2.3

minimumReleaseAgeExclude:
  # Viem 2.57.12 derives configurable account addresses from the initial config hash, and pins ox 0.14.59.
  - ox@0.14.59
  - viem@2.57.12

overrides:
  # The examples name published ranges, so a copy installs as it is. In the workspace, each resolves to the
  # catalog's version, and `accounts` to the root package.
  'example-backend>@cloudflare/workers-types': 'catalog:'
  'example-backend>@types/node': 'catalog:'
  'example-backend>accounts': 'workspace:*'
  'example-backend>hono': 'catalog:'
  'example-backend>typescript': 'catalog:'
  'example-backend>viem': 'catalog:'
  'example-backend>wrangler': 'catalog:'
  'example-cli>@types/node': 'catalog:'
  'example-cli>accounts': 'workspace:*'
  'example-cli>tsx': 'catalog:'
  'example-cli>typescript': 'catalog:'
  'example-cli>viem': 'catalog:'
  'example-mobile>@types/node': 'catalog:'
  'example-mobile>@types/react': 'catalog:mobile'
  'example-mobile>accounts': 'workspace:*'
  'example-mobile>expo': 'catalog:'
  'example-mobile>expo-secure-store': 'catalog:'
  'example-mobile>expo-web-browser': 'catalog:'
  'example-mobile>react': 'catalog:mobile'
  'example-mobile>react-native': 'catalog:'
  'example-mobile>react-native-get-random-values': 'catalog:'
  'example-mobile>typescript': 'catalog:'
  'example-mobile>viem': 'catalog:'
  'example-wagmi>@tanstack/react-query': 'catalog:'
  'example-wagmi>@types/react': 'catalog:'
  'example-wagmi>@types/react-dom': 'catalog:'
  'example-wagmi>@vitejs/plugin-react': 'catalog:'
  'example-wagmi>@wagmi/core': 'catalog:'
  'example-wagmi>accounts': 'workspace:*'
  'example-wagmi>react': 'catalog:'
  'example-wagmi>react-dom': 'catalog:'
  'example-wagmi>typescript': 'catalog:'
  'example-wagmi>viem': 'catalog:'
  'example-wagmi>vite': 'catalog:examples'
  'example-wagmi>wagmi': 'catalog:'
  'example-web>@types/react': 'catalog:'
  'example-web>@types/react-dom': 'catalog:'
  'example-web>@vitejs/plugin-react': 'catalog:'
  'example-web>accounts': 'workspace:*'
  'example-web>react': 'catalog:'
  'example-web>react-dom': 'catalog:'
  'example-web>typescript': 'catalog:'
  'example-web>viem': 'catalog:'
  'example-web>vite': 'catalog:examples'
  # oxfmt 0.51, which zile pins, depends on tinypool 2.1.0, which GHSA-85c8-ppgw-ccpr affects.
  oxfmt>tinypool: 2.2.0
  # prool pins tar 7.2.0, which GHSA-23hp-3jrh-7fpw affects.
  prool>tar: 7.5.22

  undici@>=7.0.0 <7.30.1: 7.30.1
  zod@>=4.0.0 <4.6.6: 4.6.7
  body-parser@>=2.0.0 <2.4.0: 2.4.0
  postal-mime@>=3.0.0 <4.0.8: 4.0.8
  esbuild@<0.25.0: 0.25.12
  uuid@<11.1.1: 11.1.1
  # Expo 57 (@expo/cli, config, fingerprint) pins glob 13 and minimatch 10, and archiver 7 (testcontainers)
  # pins glob 10 and minimatch 5, which GHSA-3g3m-2fjr-6pw4 and GHSA-g3hv-75wg-m249 affect.
  glob@>=9.0.0 <14.0.2: 14.0.3
  minimatch@>=5.0.0 <11.0.1: 11.0.3

peerDependencyRules:
  allowedVersions:
    accounts: '*'
    # Vite+ core uses the toolchain release version while implementing Vite 8.
    vite: '1.3.0'

shellEmulator: true

strictDepBuilds: true

trustPolicy: no-downgrade

trustPolicyExclude:
  # Expo 57 packages publish without the trusted-publisher evidence of earlier Expo releases.
  - '@expo/*'
  - '@noble/curves@1.8.0'
  - '@noble/hashes@1.7.0'
  - babel-preset-expo
  - chokidar@4.0.3
  - 'expo-*'
  - jose@4.15.9
  - react-device-detect@2.2.3
  - semver@6.3.1
  - reselect@5.1.1
  - slow-redact@0.3.2
  - ua-parser-js@1.0.41
  - undici-types@6.19.8

patchedDependencies:
  # viem builds its aggregate Tempo ABIs, such as `Abis.all`, with array spreads at module scope, which a
  # bundler keeps as possible side effects, so every ABI ships with any import of `Abis.js`. The patch
  # marks each aggregate pure, so a bundle keeps only the ABIs it reads.
  viem@2.57.12: patches/viem@2.57.12.patch
  # zile's `Examples` module imports the classic `typescript` API, which TypeScript 7 does not ship. The
  # patch reads JSDoc ranges without it. It also adds `--project` to `publish:prepare`, which otherwise
  # compiles with `tsconfig.json`.
  zile@0.0.29: patches/zile@0.0.29.patch
