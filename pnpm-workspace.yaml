peerDependencyRules:
  allowedVersions:
    accounts: '*'
    # Vite+ core uses the toolchain release version while implementing Vite 8.
    vite: '1.3.0'

shellEmulator: true

strictDepBuilds: true

trustPolicy: no-downgrade

trustPolicyExclude:
  # Expo 57 packages publish without the trusted-publisher evidence of earlier Expo releases.
  - '@expo/*'
  - '@noble/curves@1.8.0'
  - '@noble/hashes@1.7.0'
  - babel-preset-expo
  - chokidar@4.0.3
  - 'expo-*'
  - jose@4.15.9
  - react-device-detect@2.2.3
  - semver@6.3.1
  - reselect@5.1.1
  - slow-redact@0.3.2
  - ua-parser-js@1.0.41
  - undici-types@6.19.8

patchedDependencies:
  # zile's `Examples` module imports the classic `typescript` API, which TypeScript 7 does not ship. The
  # patch reads JSDoc ranges without it. It also adds `--project` to `publish:prepare`, which otherwise
  # compiles with `tsconfig.json`. Its `writePackageJson` skips an unchanged manifest and renames a
  # changed one into place, since an install links the examples while `zile dev` rewrites it.
  zile@0.0.29: patches/zile@0.0.29.patch
